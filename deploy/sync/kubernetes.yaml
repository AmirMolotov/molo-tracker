apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tracker-sync-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracker-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tracker-sync
  template:
    metadata:
      labels:
        app: tracker-sync
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: python:3.13-alpine
          command: [python, -B, -u, /app/server.py]
          env:
            - name: MOLO_DB
              value: /data/sync.sqlite3
            - name: MOLO_PREFIX
              value: ""
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: code
          configMap:
            name: tracker-sync-code
        - name: data
          persistentVolumeClaim:
            claimName: tracker-sync-data
---
apiVersion: v1
kind: Service
metadata:
  name: tracker-sync
spec:
  selector:
    app: tracker-sync
  ports:
    - port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tracker-sync
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare
spec:
  ingressClassName: traefik
  tls:
    - hosts: [tracker.momentummania.com]
  rules:
    - host: tracker.momentummania.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracker-sync
                port:
                  number: 80
