[package]
name = "molo-tracker"
version = "0.2.1"
edition = "2024"

[dependencies]
chrono = "0.4"
psl = "2"
rune = { git = "https://github.com/anomalyco/rune", rev = "337a06f38b6347ca47a51cbb24b994677d883ddd" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.62", features = [
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
debug = 0


# Cargo does not inherit patches from dependency workspaces. Use Rune's own patched crates.
[patch.crates-io]
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "337a06f38b6347ca47a51cbb24b994677d883ddd" }
winit = { git = "https://github.com/anomalyco/rune", rev = "337a06f38b6347ca47a51cbb24b994677d883ddd" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "337a06f38b6347ca47a51cbb24b994677d883ddd" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "337a06f38b6347ca47a51cbb24b994677d883ddd" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "337a06f38b6347ca47a51cbb24b994677d883ddd" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "337a06f38b6347ca47a51cbb24b994677d883ddd" }
